name: One-time primary Overpass smoke test

on:
  push:
    branches: [ops/test-overpass-primary]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe primary Overpass once with the reduced query
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://overpass-api.de/api/interpreter";
          const query = '[out:json][timeout:5];(nwr(around:300,28.6315,77.2194)[amenity~"^(school|hospital|clinic|pharmacy|supermarket)$"];nwr(around:300,28.6315,77.2194)[highway="bus_stop"];);out center tags 10;';
          const started = Date.now();
          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                "User-Agent": "InfracisLocationDueDiligence/1.0 (https://github.com/kaustubhdua/infracis)",
                "Accept": "application/json"
              },
              body: new URLSearchParams({ data: query }),
              signal: AbortSignal.timeout(15000)
            });
            let validJson = false;
            let elementCount = null;
            try {
              const body = await response.json();
              validJson = !!body && typeof body === "object" && Array.isArray(body.elements);
              elementCount = validJson ? body.elements.length : null;
            } catch {}
            console.log(JSON.stringify({ endpoint, status: response.status, ok: response.ok && validJson, elapsedMs: Date.now() - started, validJson, elementCount }));
          } catch (error) {
            console.log(JSON.stringify({ endpoint, ok: false, elapsedMs: Date.now() - started, error: error instanceof Error ? error.message : "Unknown fetch failure" }));
          }
          NODE
