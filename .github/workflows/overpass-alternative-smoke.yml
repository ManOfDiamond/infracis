name: One-time Overpass endpoint smoke test

on:
  push:
    branches: [ops/test-overpass-alternatives]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe two alternate public Overpass instances once each
        run: |
          node --input-type=module <<'NODE'
          const endpoints = [
            "https://overpass.private.coffee/api/interpreter",
            "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
          ];
          const query = '[out:json][timeout:5];node(around:300,28.6315,77.2194)[amenity];out ids 5;';
          for (const endpoint of endpoints) {
            const started = Date.now();
            try {
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                  "User-Agent": "InfracisLocationDueDiligence/1.0 (https://github.com/kaustubhdua/infracis)",
                  "Accept": "application/json"
                },
                body: new URLSearchParams({ data: query }),
                signal: AbortSignal.timeout(15000)
              });
              let validJson = false;
              let elementCount = null;
              try {
                const body = await response.json();
                validJson = !!body && typeof body === "object" && Array.isArray(body.elements);
                elementCount = validJson ? body.elements.length : null;
              } catch {}
              console.log(JSON.stringify({
                endpoint, status: response.status, ok: response.ok && validJson,
                elapsedMs: Date.now() - started, validJson, elementCount
              }));
              if (response.status === 429 || response.status === 406) {
                console.log("Rate limit response; no retry will be attempted.");
              }
            } catch (error) {
              console.log(JSON.stringify({
                endpoint, ok: false, elapsedMs: Date.now() - started,
                error: error instanceof Error ? error.message : "Unknown fetch failure"
              }));
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          NODE
